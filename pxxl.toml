# Matchday Fate API (FastAPI) on Pxxl. The Next.js frontend in web/ deploys
# separately on Vercel — this file scopes the API service to the repo root.
# Deploy this service from the GitHub source (repo + branch + commit), NOT
# the Dockerfile-upload source: the upload ships only the Dockerfile with no
# build context, so `COPY requirements.txt` fails with "no such file or
# directory". Pxxl reads pxxl.toml from the deployment commit.
[build]
language = "python"
framework = "fastapi"
packageManager = "pip"
runtime = "3.14"
baseDirectory = "/"
port = 7860
installCommand = "pip install -r requirements.txt"
buildCommand = ""
startCommand = "uvicorn api:app --host 0.0.0.0 --port ${PORT:-7860}"

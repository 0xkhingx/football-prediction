name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      # Data rebuild (deterministic core only — data_pull's football-data
      # source is best-effort and routinely unreachable; openfootball covers it).
      - run: python -m src.pull_openfootball
      - run: python -m src.clean
      - run: python -m src.features
      - run: python -m src.split
      - run: python -m src.train_tuned_prod
      - run: python -m pytest tests/ -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
